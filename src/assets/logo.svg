<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Main Background Circle -->
  <circle cx="128" cy="128" r="120" fill="#9903c0" opacity="0.95"/>
  
  <!-- Inner Circle Gradient Background -->
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#b635db;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9903c0;stop-opacity:1" />
    </linearGradient>
    <filter id="logoShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- QR Code Grid Pattern (Background) -->
  <g opacity="0.15">
    <rect x="70" y="70" width="12" height="12" fill="white"/>
    <rect x="90" y="70" width="12" height="12" fill="white"/>
    <rect x="110" y="70" width="12" height="12" fill="white"/>
    <rect x="130" y="70" width="12" height="12" fill="white"/>
    <rect x="150" y="70" width="12" height="12" fill="white"/>
    <rect x="170" y="70" width="12" height="12" fill="white"/>
    
    <rect x="70" y="90" width="12" height="12" fill="white"/>
    <rect x="150" y="90" width="12" height="12" fill="white"/>
    <rect x="170" y="90" width="12" height="12" fill="white"/>
    
    <rect x="70" y="110" width="12" height="12" fill="white"/>
    <rect x="110" y="110" width="12" height="12" fill="white"/>
    <rect x="130" y="110" width="12" height="12" fill="white"/>
    <rect x="170" y="110" width="12" height="12" fill="white"/>
    
    <rect x="70" y="130" width="12" height="12" fill="white"/>
    <rect x="110" y="130" width="12" height="12" fill="white"/>
    <rect x="150" y="130" width="12" height="12" fill="white"/>
    <rect x="170" y="130" width="12" height="12" fill="white"/>
    
    <rect x="90" y="150" width="12" height="12" fill="white"/>
    <rect x="110" y="150" width="12" height="12" fill="white"/>
    <rect x="150" y="150" width="12" height="12" fill="white"/>
    
    <rect x="70" y="170" width="12" height="12" fill="white"/>
    <rect x="130" y="170" width="12" height="12" fill="white"/>
    <rect x="170" y="170" width="12" height="12" fill="white"/>
  </g>

  <!-- Main Barcode Symbol -->
  <g filter="url(#logoShadow)">
    <!-- Barcode Vertical Lines -->
    <rect x="85" y="110" width="3" height="50" fill="white" rx="1.5"/>
    <rect x="95" y="110" width="2" height="50" fill="white"/>
    <rect x="103" y="110" width="4" height="50" fill="white" rx="2"/>
    <rect x="114" y="110" width="3" height="50" fill="white" rx="1.5"/>
    <rect x="124" y="110" width="2" height="50" fill="white"/>
    <rect x="132" y="110" width="3" height="50" fill="white" rx="1.5"/>
    <rect x="142" y="110" width="4" height="50" fill="white" rx="2"/>
    <rect x="153" y="110" width="2" height="50" fill="white"/>
    <rect x="161" y="110" width="3" height="50" fill="white" rx="1.5"/>
    
    <!-- Scanning Line (animated) -->
    <line x1="80" y1="115" x2="176" y2="115" stroke="white" stroke-width="2" opacity="0.6" stroke-dasharray="4,2"/>
  </g>

  <!-- Outer Ring Accent -->
  <circle cx="128" cy="128" r="120" fill="none" stroke="white" stroke-width="2" opacity="0.3"/>
  <circle cx="128" cy="128" r="115" fill="none" stroke="white" stroke-width="1" opacity="0.2"/>

  <!-- Floating Scan Particles (accent dots) -->
  <g opacity="0.8">
    <circle cx="110" cy="95" r="2" fill="white"/>
    <circle cx="145" cy="100" r="1.5" fill="white"/>
    <circle cx="155" cy="150" r="2" fill="white"/>
    <circle cx="100" cy="175" r="1.5" fill="white"/>
  </g>
</svg>