<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Rounded Square Background -->
  <rect width="200" height="200" rx="40" fill="#9903c0"/>
  
  <defs>
    <filter id="shadowSquare" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- QR Code Symbol -->
  <g filter="url(#shadowSquare)">
    <!-- Top-left corner mark -->
    <rect x="30" y="30" width="18" height="18" fill="white"/>
    <rect x="35" y="35" width="8" height="8" fill="#9903c0"/>
    
    <!-- Bottom-left corner mark -->
    <rect x="30" y="152" width="18" height="18" fill="white"/>
    <rect x="35" y="157" width="8" height="8" fill="#9903c0"/>
    
    <!-- Top-right corner mark -->
    <rect x="152" y="30" width="18" height="18" fill="white"/>
    <rect x="157" y="35" width="8" height="8" fill="#9903c0"/>
  </g>

  <!-- Center Scanning Icon -->
  <g opacity="0.95">
    <!-- Horizontal Barcode Lines -->
    <rect x="60" y="85" width="3" height="30" fill="white" rx="1.5"/>
    <rect x="72" y="85" width="2" height="30" fill="white"/>
    <rect x="82" y="85" width="4" height="30" fill="white"/>
    <rect x="95" y="85" width="3" height="30" fill="white" rx="1.5"/>
    <rect x="108" y="85" width="2" height="30" fill="white"/>
    <rect x="118" y="85" width="3" height="30" fill="white" rx="1.5"/>
    <rect x="130" y="85" width="4" height="30" fill="white"/>
    <rect x="143" y="85" width="2" height="30" fill="white"/>
    <rect x="152" y="85" width="3" height="30" fill="white" rx="1.5"/>
    
    <!-- Scanning Indicator Line -->
    <line x1="55" y1="95" x2="155" y2="95" stroke="white" stroke-width="1.5" opacity="0.7"/>
  </g>

  <!-- Decorative Elements -->
  <g opacity="0.6">
    <circle cx="85" cy="55" r="1.5" fill="white"/>
    <circle cx="125" cy="60" r="1" fill="white"/>
    <circle cx="140" cy="120" r="1.5" fill="white"/>
    <circle cx="75" cy="145" r="1" fill="white"/>
  </g>

  <!-- Border Accent -->
  <rect width="200" height="200" rx="40" fill="none" stroke="white" stroke-width="1.5" opacity="0.3"/>
</svg>